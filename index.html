<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vorscorp — Engineering Systems of Reasoning</title>
<meta name="description" content="Vorscorp is building systems of reasoning for technology, business, strategy, and emerging opportunities.">

<link rel="canonical" href="https://vorscorp.com/">
<meta name="theme-color" content="#0B0B0B">
<meta name="color-scheme" content="dark">

<meta property="og:type" content="website">
<meta property="og:url" content="https://vorscorp.com/">
<meta property="og:site_name" content="Vorscorp">
<meta property="og:title" content="Vorscorp — Engineering Systems of Reasoning">
<meta property="og:description" content="Vorscorp is building systems of reasoning for technology, business, strategy, and emerging opportunities.">
<meta property="og:image" content="https://vorscorp.com/assets/brand/vorscorp-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Vorscorp">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Vorscorp — Engineering Systems of Reasoning">
<meta name="twitter:description" content="Vorscorp is building systems of reasoning for technology, business, strategy, and emerging opportunities.">
<meta name="twitter:image" content="https://vorscorp.com/assets/brand/vorscorp-og.png">

<!-- Square icons. Search engines render the favicon at 48px, so the wordmark
     is letterboxed on the brand field rather than stretched or cropped. -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/brand/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/brand/icon-512.png">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">

<link rel="preload" href="/assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css">

<!-- Without scripting the counter can never fill in, so it is withdrawn
     rather than left showing placeholders. The launch date still stands. -->
<noscript>
  <style>
    .counter { display: none; }
  </style>
</noscript>
</head>

<body>

<!-- Static structural rules. Decorative only; never animated. -->
<div class="rules" aria-hidden="true">
  <span class="rules__line rules__line--start"></span>
  <span class="rules__line rules__line--end"></span>
</div>

<div class="frame">

  <main class="stage" id="main">

    <!-- The supplied wordmark, unmodified. Clear space is held by the
         margin below it, never by cropping the asset. -->
    <img class="mark" src="/assets/brand/vorscorp-wordmark-white.png"
         alt="Vorscorp"
         width="1055" height="174" fetchpriority="high" decoding="async">

    <h1 class="statement" aria-label="Engineering Systems of Reasoning.">
      <span class="statement__line"><span class="scramble">Engineering</span></span>
      <span class="statement__line"><span class="scramble">Systems</span> <span class="scramble">of</span> <span class="scramble">Reasoning</span>.</span>
    </h1>

    <div class="launch">
      <p class="label" data-counter-label>Public Launch &middot; UTC+08:00</p>

      <p class="launch__date">
        <time datetime="2026-10-15T00:00:00+08:00">15 October 2026</time>
      </p>

      <!-- The digits change every second; assistive technology reads the
           stable sentence below instead of a ticking readout. -->
      <div class="counter" aria-hidden="true" data-counter>
        <span class="counter__unit">
          <span class="counter__value" data-unit="days">--</span>
          <span class="counter__name">Days</span>
        </span>
        <span class="counter__sep">:</span>
        <span class="counter__unit">
          <span class="counter__value" data-unit="hours">--</span>
          <span class="counter__name">Hrs</span>
        </span>
        <span class="counter__sep">:</span>
        <span class="counter__unit">
          <span class="counter__value" data-unit="minutes">--</span>
          <span class="counter__name">Min</span>
        </span>
        <span class="counter__sep">:</span>
        <span class="counter__unit">
          <span class="counter__value" data-unit="seconds">--</span>
          <span class="counter__name">Sec</span>
        </span>
      </div>

      <p class="visually-hidden" data-counter-text>Counting down to 15 October 2026.</p>
    </div>

    <p class="stage__note" data-note>A new Vorscorp is taking shape.</p>

  </main>

  <footer class="colophon">
    <ul class="colophon__links">
      <li>
        <a href="https://instagram.com/vorscorp"
           target="_blank" rel="noopener noreferrer"
           aria-label="Vorscorp on Instagram">Instagram</a>
      </li>
      <li>
        <a href="https://www.linkedin.com/company/vorscorp"
           target="_blank" rel="noopener noreferrer"
           aria-label="Vorscorp on LinkedIn">LinkedIn</a>
      </li>
    </ul>
    <p class="colophon__rights">&copy; 2026 Vorscorp. All rights reserved.</p>
  </footer>

</div>

<script src="/assets/js/scramble.js" defer></script>
<script src="/assets/js/countdown.js" defer></script>
</body>
</html>
